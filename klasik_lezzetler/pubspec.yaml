name: klasik_lezzetler
description: "Ozcook - Tarif, kalori, OzFit, OzDay ve OzHealth uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  url_launcher: ^6.3.1
  youtube_player_iframe: ^5.2.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/ozcook_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ozcook_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ozcook_logo.png"